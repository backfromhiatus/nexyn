<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisp Proxy Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            background: #2d2d2d;
            padding: 12px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid #3d3d3d;
        }

        .url-bar {
            flex: 1;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            background: #1a1a1a;
            border: 1px solid #3d3d3d;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #4a9eff;
        }

        button {
            padding: 10px 20px;
            background: #4a9eff;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover {
            background: #357abd;
        }

        button:disabled {
            background: #3d3d3d;
            cursor: not-allowed;
        }

        .nav-buttons button {
            padding: 8px 12px;
            background: #3d3d3d;
        }

        .nav-buttons button:hover:not(:disabled) {
            background: #4d4d4d;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            padding: 0 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4444;
        }

        .status-dot.connected {
            background: #44ff44;
        }

        .iframe-container {
            flex: 1;
            position: relative;
            background: #fff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4a9eff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #ff4444;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="nav-buttons">
            <button id="backBtn" disabled>←</button>
            <button id="forwardBtn" disabled>→</button>
            <button id="refreshBtn">⟳</button>
        </div>
        <div class="url-bar">
            <input type="text" id="urlInput" placeholder="Enter URL (e.g., example.com or http://example.com)">
            <button id="goBtn">Go</button>
        </div>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Disconnected</span>
        </div>
    </div>
    <div class="iframe-container">
        <div class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            <div>Loading...</div>
        </div>
        <iframe id="contentFrame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    </div>

    <script>
        class WispClient {
            constructor(url) {
                this.url = url;
                this.ws = null;
                this.streams = new Map();
                this.nextStreamId = 1;
                this.connected = false;
                this.initialBufferSize = 0;
            }

            async connect() {
                return new Promise((resolve, reject) => {
                    this.ws = new WebSocket(this.url);
                    this.ws.binaryType = 'arraybuffer';

                    this.ws.onopen = () => {
                        console.log('WebSocket connected');
                    };

                    this.ws.onmessage = (event) => {
                        this.handleMessage(event.data);
                        if (!this.connected) {
                            this.connected = true;
                            resolve();
                        }
                    };

                    this.ws.onerror = (error) => {
                        console.error('WebSocket error:', error);
                        reject(error);
                    };

                    this.ws.onclose = () => {
                        console.log('WebSocket closed');
                        this.connected = false;
                    };
                });
            }

            handleMessage(data) {
                const view = new DataView(data);
                const packetType = view.getUint8(0);
                const streamId = view.getUint32(1, true);
                const payload = data.slice(5);

                const stream = this.streams.get(streamId);

                if (packetType === 0x02) {
                    if (stream && stream.onData) {
                        stream.onData(new Uint8Array(payload));
                    }
                } else if (packetType === 0x03) {
                    const bufferRemaining = new DataView(payload).getUint32(0, true);
                    if (streamId === 0) {
                        this.initialBufferSize = bufferRemaining;
                    } else if (stream) {
                        stream.bufferRemaining = bufferRemaining;
                    }
                } else if (packetType === 0x04) { 
                    const reason = new DataView(payload).getUint8(0);
                    console.log(`Stream ${streamId} closed with reason: ${reason}`);
                    if (stream && stream.onClose) {
                        stream.onClose(reason);
                    }
                    this.streams.delete(streamId);
                }
            }

            createStream(hostname, port, type = 0x01) {
                const streamId = this.nextStreamId++;
                const stream = {
                    id: streamId,
                    bufferRemaining: this.initialBufferSize,
                    onData: null,
                    onClose: null
                };
                this.streams.set(streamId, stream);

                const hostnameBytes = new TextEncoder().encode(hostname);
                const payload = new Uint8Array(3 + hostnameBytes.length);
                payload[0] = type; 
                new DataView(payload.buffer).setUint16(1, port, true);
                payload.set(hostnameBytes, 3);

                this.sendPacket(0x01, streamId, payload);
                return stream;
            }

            sendData(streamId, data) {
                this.sendPacket(0x02, streamId, data);
            }

            closeStream(streamId) {
                const payload = new Uint8Array([0x02]);
                this.sendPacket(0x04, streamId, payload);
                this.streams.delete(streamId);
            }

            sendPacket(type, streamId, payload) {
                const packet = new Uint8Array(5 + payload.length);
                packet[0] = type;
                new DataView(packet.buffer).setUint32(1, streamId, true);
                packet.set(payload, 5);
                this.ws.send(packet);
            }
        }

        class ProxyBrowser {
            constructor() {
                this.wisp = new WispClient('ws://localhost:8080/');
                this.urlInput = document.getElementById('urlInput');
                this.goBtn = document.getElementById('goBtn');
                this.backBtn = document.getElementById('backBtn');
                this.forwardBtn = document.getElementById('forwardBtn');
                this.refreshBtn = document.getElementById('refreshBtn');
                this.contentFrame = document.getElementById('contentFrame');
                this.loading = document.getElementById('loading');
                this.statusDot = document.getElementById('statusDot');
                this.statusText = document.getElementById('statusText');
                this.currentUrl = '';
                this.history = [];
                this.historyIndex = -1;

                this.init();
            }

            async init() {
                try {
                    await this.wisp.connect();
                    this.updateStatus(true);
                    this.setupEventListeners();
                } catch (error) {
                    console.error('Failed to connect:', error);
                    this.updateStatus(false);
                    alert('Failed to connect to Wisp server. Make sure it\'s running on localhost:8080');
                }
            }

            setupEventListeners() {
                this.goBtn.addEventListener('click', () => this.navigate());
                this.urlInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.navigate();
                });
                this.backBtn.addEventListener('click', () => this.goBack());
                this.forwardBtn.addEventListener('click', () => this.goForward());
                this.refreshBtn.addEventListener('click', () => this.refresh());
            }

            updateStatus(connected) {
                if (connected) {
                    this.statusDot.classList.add('connected');
                    this.statusText.textContent = 'Connected';
                } else {
                    this.statusDot.classList.remove('connected');
                    this.statusText.textContent = 'Disconnected';
                }
            }

            async navigate() {
                let url = this.urlInput.value.trim();
                if (!url) return;

                if (!url.match(/^https?:\/\//)) {
                    url = 'https://' + url; 
                }

                this.currentUrl = url;
                this.addToHistory(url);
                await this.loadUrl(url);
            }

            addToHistory(url) {
                this.historyIndex++;
                this.history = this.history.slice(0, this.historyIndex);
                this.history.push(url);
                this.updateNavButtons();
            }

            updateNavButtons() {
                this.backBtn.disabled = this.historyIndex <= 0;
                this.forwardBtn.disabled = this.historyIndex >= this.history.length - 1;
            }

            goBack() {
                if (this.historyIndex > 0) {
                    this.historyIndex--;
                    this.loadUrl(this.history[this.historyIndex]);
                    this.updateNavButtons();
                }
            }

            goForward() {
                if (this.historyIndex < this.history.length - 1) {
                    this.historyIndex++;
                    this.loadUrl(this.history[this.historyIndex]);
                    this.updateNavButtons();
                }
            }

            refresh() {
                if (this.currentUrl) {
                    this.loadUrl(this.currentUrl);
                }
            }

            async loadUrl(url) {
                this.loading.style.display = 'block';
                this.urlInput.value = url;

                try {
                    const parsedUrl = new URL(url);
                    const hostname = parsedUrl.hostname;
                    const port = parsedUrl.port || (parsedUrl.protocol === 'https:' ? 443 : 80);
                    const path = parsedUrl.pathname + parsedUrl.search;

                    // Use TLS for HTTPS, TCP for HTTP
                    const streamType = parsedUrl.protocol === 'https:' ? 0x03 : 0x01;
                    
                    const content = await this.fetchHttp(hostname, port, path, streamType);
                    this.renderContent(content, url);
                } catch (error) {
                    console.error('Error loading URL:', error);
                    this.contentFrame.srcdoc = `<div class="error">Error loading page: ${error.message}</div>`;
                } finally {
                    this.loading.style.display = 'none';
                }
            }

            async fetchHttp(hostname, port, path, streamType) {
                return new Promise((resolve, reject) => {
                    const stream = this.wisp.createStream(hostname, port, streamType);
                    let responseData = new Uint8Array();

                    stream.onData = (data) => {
                        const newData = new Uint8Array(responseData.length + data.length);
                        newData.set(responseData);
                        newData.set(data, responseData.length);
                        responseData = newData;
                    };

                    stream.onClose = (reason) => {
                        if (responseData.length > 0) {
                            resolve(new TextDecoder().decode(responseData));
                        } else {
                            reject(new Error(`Connection closed with reason: ${reason}`));
                        }
                    };

                    // Send HTTP request
                    const request = `GET ${path} HTTP/1.1\r\nHost: ${hostname}\r\nConnection: close\r\nUser-Agent: WispProxy/1.0\r\nAccept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8\r\nAccept-Language: en-US,en;q=0.5\r\nAccept-Encoding: identity\r\n\r\n`;
                    this.wisp.sendData(stream.id, new TextEncoder().encode(request));

                    // Timeout after 30 seconds
                    setTimeout(() => {
                        this.wisp.closeStream(stream.id);
                        if (responseData.length > 0) {
                            resolve(new TextDecoder().decode(responseData));
                        } else {
                            reject(new Error('Request timeout'));
                        }
                    }, 30000);
                });
            }

            renderContent(httpResponse, baseUrl) {
                // Parse HTTP response
                const headerEnd = httpResponse.indexOf('\r\n\r\n');
                if (headerEnd === -1) {
                    this.contentFrame.srcdoc = '<div class="error">Invalid HTTP response</div>';
                    return;
                }

                const headers = httpResponse.substring(0, headerEnd);
                const body = httpResponse.substring(headerEnd + 4);
                
                // Check for redirects
                if (headers.includes('301 Moved') || headers.includes('302 Found') || headers.includes('307 Temporary Redirect') || headers.includes('308 Permanent Redirect')) {
                    const locationMatch = headers.match(/Location:\s*(.+)\r\n/i);
                    if (locationMatch && locationMatch[1]) {
                        const redirectUrl = locationMatch[1].trim();
                        console.log('Redirecting to:', redirectUrl);
                        this.loadUrl(redirectUrl);
                        return;
                    }
                }
                
                // Rewrite URLs in the content
                const rewrittenBody = this.rewriteUrls(body, baseUrl);
                
                this.contentFrame.srcdoc = rewrittenBody;
            }

            rewriteUrls(html, baseUrl) {
                const base = new URL(baseUrl);
                
                // Rewrite absolute URLs
                html = html.replace(/https?:\/\/[^\s"'<>)]+/g, (match) => {
                    return this.createProxyUrl(match);
                });

                // Rewrite relative URLs in href attributes
                html = html.replace(/href=["']([^"']+)["']/g, (match, url) => {
                    if (url.startsWith('http://') || url.startsWith('https://')) {
                        return `href="${this.createProxyUrl(url)}"`;
                    } else if (url.startsWith('//')) {
                        return `href="${this.createProxyUrl(base.protocol + url)}"`;
                    } else if (url.startsWith('/')) {
                        return `href="${this.createProxyUrl(base.origin + url)}"`;
                    } else if (!url.startsWith('#') && !url.startsWith('javascript:') && !url.startsWith('mailto:')) {
                        const newUrl = new URL(url, baseUrl).href;
                        return `href="${this.createProxyUrl(newUrl)}"`;
                    }
                    return match;
                });

                // Rewrite src attributes
                html = html.replace(/src=["']([^"']+)["']/g, (match, url) => {
                    if (url.startsWith('http://') || url.startsWith('https://')) {
                        return `src="${this.createProxyUrl(url)}"`;
                    } else if (url.startsWith('//')) {
                        return `src="${this.createProxyUrl(base.protocol + url)}"`;
                    } else if (url.startsWith('/')) {
                        return `src="${this.createProxyUrl(base.origin + url)}"`;
                    } else if (!url.startsWith('data:') && !url.startsWith('javascript:')) {
                        const newUrl = new URL(url, baseUrl).href;
                        return `src="${this.createProxyUrl(newUrl)}"`;
                    }
                    return match;
                });

                // Rewrite CSS url() references
                html = html.replace(/url\(["']?([^"')]+)["']?\)/g, (match, url) => {
                    if (url.startsWith('http://') || url.startsWith('https://')) {
                        return `url("${this.createProxyUrl(url)}")`;
                    } else if (url.startsWith('//')) {
                        return `url("${this.createProxyUrl(base.protocol + url)}")`;
                    } else if (url.startsWith('/')) {
                        return `url("${this.createProxyUrl(base.origin + url)}")`;
                    } else if (!url.startsWith('data:')) {
                        const newUrl = new URL(url, baseUrl).href;
                        return `url("${this.createProxyUrl(newUrl)}")`;
                    }
                    return match;
                });

                return html;
            }

            createProxyUrl(url) {
                // For now, just return a hash to prevent actual navigation
                // In a real implementation, you'd handle these through the proxy
                return '#';
            }
        }

        // Initialize the browser when page loads
        window.addEventListener('DOMContentLoaded', () => {
            new ProxyBrowser();
        });
    </script>
</body>
</html>
